<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101211">
<title>ม้วน กล้องฟิล์ม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#EEF0EC; --card:#FFFFFF; --ink:#171A19; --ink2:#5A635E; --rule:rgba(23,26,25,.12); --accent:#E8572A;
  --sheet:#F6F7F4; --scrim:rgba(10,12,11,.5); --danger:#C23A2B; --chip:rgba(23,26,25,.06);
  --sans:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Thonburi,Tahoma,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101211; --card:#1A1D1C; --ink:#EDEFEA; --ink2:#A2ABA5; --rule:rgba(237,239,234,.14);
    --sheet:#1A1D1C; --scrim:rgba(0,0,0,.62); --danger:#FF6B5B; --chip:rgba(237,239,234,.08);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101211; --card:#1A1D1C; --ink:#EDEFEA; --ink2:#A2ABA5; --rule:rgba(237,239,234,.14);
  --sheet:#1A1D1C; --scrim:rgba(0,0,0,.62); --danger:#FF6B5B; --chip:rgba(237,239,234,.08);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid #FF7A1A;outline-offset:2px}
[hidden]{display:none!important}
.small{font-size:13px;color:var(--ink2)}
#app{height:100%;max-width:520px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;display:none;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen.on{display:block}
#video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}
svg.i{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ================= camera screen ================= */
#scr-cam{--body:#222;--p1:#ddd;--p2:#999;--trim:#fa0;--ink:#222;--tsh:0 1px 0 rgba(255,255,255,.55);--bt:#fff;--bt2:rgba(255,255,255,.7);--ib:rgba(0,0,0,.28);--vfr:10px;--bez:#0a0a0a;
  background:var(--body);color:var(--bt)}
#scr-cam.on{display:flex;flex-direction:column;overflow:hidden}
.tex-leather{background-color:var(--body);background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.07) 0 1px,transparent 1.5px),radial-gradient(circle at 60% 70%,rgba(0,0,0,.3) 0 1.2px,transparent 1.8px);background-size:5px 5px,7px 6px}
.tex-smooth{background:linear-gradient(180deg,var(--body),color-mix(in srgb,var(--body) 82%,#000))}
.tex-card{background-color:var(--body);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 7px),radial-gradient(circle at 80% 90%,rgba(239,71,111,.55) 0 90px,transparent 91px),radial-gradient(circle at 10% 70%,rgba(6,214,160,.5) 0 60px,transparent 61px)}
.tex-grip{background-color:var(--body);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 6px)}
.tex-metal{background-color:var(--body);background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.08) 0 1px,rgba(0,0,0,.05) 1px 2px)}
.tex-plastic{background-color:var(--body);background-image:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.18))}

.plate{flex:none;height:96px;position:relative;background:linear-gradient(180deg,var(--p1),var(--p2));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 4px rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.45);z-index:3;color:var(--ink)}
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.dc{position:absolute;display:block}
.win{background:linear-gradient(135deg,#222c3a,#090d13);border-radius:4px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2),inset 0 2px 3px rgba(255,255,255,.22),0 1px 0 rgba(255,255,255,.35)}
.rnd{border-radius:50%}
.metal{background:linear-gradient(135deg,#f6f7f8,#9aa0a4 55%,#d7dadc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 2px 3px rgba(0,0,0,.35)}
.blk{background:linear-gradient(180deg,#34373b,#0d0e10);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 3px rgba(0,0,0,.4)}
.knurl{background:repeating-conic-gradient(from 0deg,#e6e8e9 0 6deg,#8e9498 6deg 12deg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),0 2px 3px rgba(0,0,0,.4)}
.led{background:var(--trim);box-shadow:0 0 6px var(--trim),inset 0 0 0 1px rgba(0,0,0,.35)}
.prism{background:linear-gradient(180deg,color-mix(in srgb,var(--p1) 85%,#fff),var(--p2));clip-path:polygon(10% 100%,20% 0,80% 0,90% 100%);box-shadow:inset 0 1px 0 #fff}
.hood{background:linear-gradient(180deg,#050506,#17181a);clip-path:polygon(6% 100%,16% 0,84% 0,94% 100%)}
.grille{background:repeating-linear-gradient(90deg,rgba(0,0,0,.45) 0 2px,transparent 2px 6px);border-radius:3px}
.stripe{height:7px;left:0;right:0;bottom:0;background:linear-gradient(90deg,var(--trim) 0 33%,#F2A93B 33% 66%,#2BA3A0 66%)}
.dots{background-image:radial-gradient(circle,rgba(0,0,0,.55) 1.2px,transparent 1.6px);background-size:7px 7px}
.nameplate{position:absolute;left:14px;top:10px;display:flex;align-items:baseline;gap:8px;text-shadow:var(--tsh);pointer-events:none;z-index:2;max-width:55%}
.nameplate .nm{font-weight:700;font-size:21px;letter-spacing:.015em;line-height:1;white-space:nowrap}
.nameplate .md{font-weight:600;font-size:12px;letter-spacing:.1em;opacity:.8;white-space:nowrap}
.tools{position:absolute;left:4px;right:4px;bottom:3px;display:flex;justify-content:space-between;z-index:2}
.tool{flex:1;max-width:76px;height:48px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink);position:relative;font-size:11px;font-weight:600;text-shadow:var(--tsh);line-height:1.1}
.tool[aria-pressed=true]::after{content:"";position:absolute;top:3px;right:calc(50% - 21px);width:7px;height:7px;border-radius:50%;background:#FF7A1A;box-shadow:0 0 6px #FF7A1A,0 0 0 1px rgba(0,0,0,.35)}
.tool .bd{position:absolute;top:4px;left:calc(50% + 6px);font-size:10px;font-weight:700;background:#FF7A1A;color:#fff;border-radius:7px;padding:0 4px;line-height:14px;text-shadow:none}
.tool:active{transform:translateY(1px)}

.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}
.vfwrap{position:relative;flex:none;background:var(--bez);border-radius:var(--vfr);box-shadow:0 0 0 6px var(--bez),0 0 0 7px rgba(255,255,255,.12),0 10px 22px rgba(0,0,0,.55)}
.vfwrap.framed{background:#F3EEE2;border-radius:3px;box-shadow:0 8px 20px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.08)}
.vf{position:absolute;overflow:hidden;background:#000;border-radius:calc(var(--vfr) - 3px);touch-action:none}
.vfwrap.framed .vf{border-radius:1px}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;pointer-events:none}
.grid-thirds{background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4)) 33.33% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4)) 66.66% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4)) 0 33.33%/100% 1px no-repeat,linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4)) 0 66.66%/100% 1px no-repeat}
.grid-cross{background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) 50% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) 0 50%/100% 1px no-repeat}
.crn{position:absolute;inset:7%;border:0;pointer-events:none;background:
  linear-gradient(#fff,#fff) 0 0/16px 1.5px no-repeat,linear-gradient(#fff,#fff) 0 0/1.5px 16px no-repeat,
  linear-gradient(#fff,#fff) 100% 0/16px 1.5px no-repeat,linear-gradient(#fff,#fff) 100% 0/1.5px 16px no-repeat,
  linear-gradient(#fff,#fff) 0 100%/16px 1.5px no-repeat,linear-gradient(#fff,#fff) 0 100%/1.5px 16px no-repeat,
  linear-gradient(#fff,#fff) 100% 100%/16px 1.5px no-repeat,linear-gradient(#fff,#fff) 100% 100%/1.5px 16px no-repeat;opacity:.8}
.crn.s8{inset:4%;opacity:.55}
.hoodshade{box-shadow:inset 0 0 46px 10px rgba(0,0,0,.75)}
.focus{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:2px solid #FFD24A;border-radius:6px;pointer-events:none;opacity:0;transform:scale(1.4)}
.focus.go{animation:focus 1.3s ease-out forwards}
@keyframes focus{0%{opacity:0;transform:scale(1.4)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
.curtain{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.curtain.fire{animation:curtain .16s steps(1,end)}
@keyframes curtain{0%{opacity:1}100%{opacity:0}}
.cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.28);color:#fff;font-size:92px;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.6);z-index:6}
.cd.on{display:flex}
.vfmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center;color:#dcdfd8;background:#070908;z-index:5;overflow:auto}
.vfmsg b{font-weight:600;font-size:16px}
.vfmsg p{margin:0;max-width:24em;font-size:13px;line-height:1.5;color:#b0b7b1}
.btnl{border:0;border-radius:999px;padding:9px 18px;background:#ECEEE8;color:#121614;font-weight:600;font-size:14px}
.btng{border:1px solid rgba(236,238,232,.4);border-radius:999px;padding:8px 16px;background:none;color:#ECEEE8;font-size:14px}
.zoombar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:3px;padding:3px;background:rgba(0,0,0,.5);border-radius:999px;z-index:4}
.zc{min-width:36px;height:30px;border:0;border-radius:15px;background:none;color:#fff;font-size:13px;font-weight:600;padding:0 8px}
.zc[aria-pressed=true]{background:#FFD24A;color:#1a1400}
.zc[data-off]{opacity:.38}
.evchip{position:absolute;left:8px;top:8px;z-index:4;height:30px;display:flex;align-items:center;gap:5px;border:0;border-radius:15px;background:rgba(0,0,0,.5);color:#fff;font-size:12.5px;font-weight:600;padding:0 11px 0 8px}
.evchip svg{width:17px;height:17px}
.evchip.on{color:#FFD24A}
.evpanel{position:absolute;left:8px;right:8px;top:44px;z-index:4;display:none;align-items:center;gap:8px;background:rgba(0,0,0,.62);border-radius:14px;padding:6px 10px;color:#fff}
.evpanel.on{display:flex}
.evpanel input{flex:1;accent-color:#FFD24A}
.evpanel button{border:0;background:none;color:#fff;font-size:20px;width:30px;height:30px;line-height:1}
.recpill{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;display:none;align-items:center;gap:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:3px 12px;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.recpill.on{display:flex}
.recpill::before{content:"";width:9px;height:9px;border-radius:50%;background:#ff3b30;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.osd{position:absolute;inset:0;pointer-events:none;color:#fff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.osd .p{position:absolute;font-size:11px;letter-spacing:.04em}
.osd .bat{display:inline-block;width:20px;height:9px;border:1.5px solid #fff;border-radius:2px;position:relative;vertical-align:-1px;margin-right:4px}
.osd .bat::before{content:"";position:absolute;inset:1.5px;background:#7CFF8A}
.osd .bat::after{content:"";position:absolute;right:-4px;top:1.5px;width:2px;height:3px;background:#fff}
.osd.digi{font-family:"Courier New",monospace}
.osd.digi::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}

.base{flex:none;padding:6px 10px calc(10px + 0px);display:flex;flex-direction:column;gap:5px;color:var(--bt);box-shadow:inset 0 3px 6px rgba(0,0,0,.25)}
.moderow{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.allbtn{display:flex;align-items:center;gap:6px;border:0;background:var(--ib);color:var(--bt);border-radius:999px;padding:5px 12px 5px 9px;font-size:12.5px;font-weight:600}
.allbtn svg{width:17px;height:17px}
.seg{display:inline-flex;background:var(--ib);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600;color:var(--bt2)}
.seg button[aria-pressed=true]{background:var(--bt);color:var(--body)}
.camtag{font-size:12px;color:var(--bt2);font-weight:600;max-width:34%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip{display:flex;gap:8px;overflow-x:auto;padding:3px 4px 2px;scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sitem{flex:none;width:56px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.82;scroll-snap-align:center;padding:0;color:var(--bt)}
.sitem .ic{width:56px;height:42px;border-radius:11px;background:var(--ib);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.sitem svg{width:48px;height:36px;display:block}
.sitem span{font-size:10.5px;font-weight:600;white-space:nowrap;max-width:60px;overflow:hidden;text-overflow:ellipsis}
.sitem[aria-current=true]{opacity:1}
.sitem[aria-current=true] .ic{box-shadow:0 0 0 2px var(--trim),0 0 12px rgba(255,255,255,.2)}
.ctrl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:2px 12px 0}
.galbtn{justify-self:start;width:54px;height:54px;border-radius:12px;border:2px solid var(--trim);background:var(--ib) center/cover no-repeat;padding:0;overflow:hidden;color:var(--bt);display:grid;place-items:center}
.flipbtn{justify-self:end;width:54px;height:54px;border-radius:50%;border:0;background:var(--ib);color:var(--bt);display:grid;place-items:center}
.flipbtn svg{width:26px;height:26px}
.shutter{width:78px;height:78px;border-radius:50%;border:0;padding:0;position:relative;background:conic-gradient(from 30deg,#f5f7f6,#9ea3a0,#e7eae8,#878d8a,#f5f7f6);box-shadow:0 4px 8px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.3)}
.shutter::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#1a211e;box-shadow:inset 0 2px 4px rgba(0,0,0,.8);transition:background .15s}
.shutter .core{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 40% 34%,#de6052,#a3271c 60%,#6d150f);box-shadow:inset 0 2px 2px rgba(255,255,255,.3),0 2px 3px rgba(0,0,0,.5);transition:transform .08s,inset .15s,border-radius .15s}
.shutter:active .core{transform:scale(.92)}
.sh-chrome .shutter .core{background:radial-gradient(circle at 40% 30%,#fff,#cfd3d6 45%,#7b8186);box-shadow:inset 0 -3px 4px rgba(0,0,0,.25),0 2px 3px rgba(0,0,0,.5)}
.sh-black .shutter{background:conic-gradient(from 30deg,#4a4d52,#16181a,#3c3f44,#121416,#4a4d52)}
.sh-black .shutter .core{background:radial-gradient(circle at 40% 30%,#4a4d52,#17191b 70%);box-shadow:inset 0 1px 1px rgba(255,255,255,.2),0 2px 3px rgba(0,0,0,.5)}
.sh-big .shutter{width:88px;height:88px;background:radial-gradient(circle at 40% 30%,#fff,#e5e5e5 60%,#bdbdbd)}
.sh-big .shutter::before{inset:9px;background:var(--trim);box-shadow:inset 0 3px 5px rgba(0,0,0,.35),inset 0 -2px 3px rgba(255,255,255,.3)}
.sh-big .shutter .core{inset:26px;background:rgba(255,255,255,.55);box-shadow:none}
.sh-rec .shutter{border-radius:22px;width:84px;height:70px;background:linear-gradient(180deg,#5a5f66,#1d2024)}
.sh-rec .shutter::before{border-radius:16px;inset:6px;background:#0d0e10}
.sh-rec .shutter .core{inset:17px 24px;border-radius:50%;background:radial-gradient(circle at 40% 34%,#ff5a4d,#d4231a 60%,#8e100a)}
.shutter.vid::before{background:#fff}
.shutter.vid .core{background:radial-gradient(circle at 40% 34%,#ff5a4d,#d4231a 60%,#8e100a)}
.shutter.recing .core{inset:25px;border-radius:7px}
.sh-big .shutter.vid::before{background:#fff}
.sh-big .shutter.vid .core{inset:26px;background:#ff3b30}
.sh-rec .shutter.recing .core{inset:22px 28px;border-radius:5px}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
#flashfx{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
#flashfx.hold{opacity:1}
@media (max-height:700px){
  .plate{height:84px}.nameplate .nm{font-size:18px}.tool{height:42px}.tool svg.i{width:20px;height:20px}
  .sitem span{display:none}.sitem .ic{height:38px}.shutter{width:68px;height:68px}.galbtn,.flipbtn{width:46px;height:46px}
}

/* ================= pages ================= */
.page{padding:0 0 28px;min-height:100%}
.phead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:10px 10px 8px;background:var(--bg);border-bottom:1px solid var(--rule)}
.phead h1{margin:0;font-size:19px;flex:1;font-weight:700}
.iconbtn{border:0;background:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--chip)}
.txtbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 10px;font-size:15px}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.gitem{position:relative;aspect-ratio:1;border:0;padding:0;background:var(--chip) center/cover no-repeat;overflow:hidden}
.gitem .vb{position:absolute;left:5px;bottom:5px;display:flex;align-items:center;gap:3px;color:#fff;font-size:11px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.gitem .ck{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.3);display:none}
.sel .gitem .ck{display:block}
.gitem.picked .ck{background:var(--accent);border-color:var(--accent)}
.gitem.picked .ck::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.gitem.picked::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3)}
.empty{padding:70px 24px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.selbar{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;justify-content:space-around;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--sheet);border-top:1px solid var(--rule);z-index:8}
.selbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;padding:4px}
.selbar button:disabled{opacity:.35}
.selbar .dg{color:var(--danger)}
.group{padding:4px 16px 0}
.group h2{font-size:13px;font-weight:700;letter-spacing:.04em;margin:22px 0 4px;color:var(--ink2);text-transform:uppercase}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule)}
.row .t{font-weight:500}
.row .d{font-size:12.5px;color:var(--ink2);margin-top:1px;line-height:1.4}
.row.col{flex-direction:column;align-items:stretch;gap:8px}
.tog{appearance:none;-webkit-appearance:none;flex:none;width:48px;height:29px;border-radius:15px;background:var(--rule);position:relative;margin:0;transition:background .15s;cursor:pointer}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.tog:checked{background:var(--accent)}
.tog:checked::after{transform:translateX(19px)}
.segs{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px;flex:none}
.segs button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--ink2);font-weight:500}
.segs button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:600}
.dangerbtn{border:0;background:none;color:var(--danger);font-weight:600;padding:14px 0;text-align:left;font-size:15px;width:100%}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:12px 0;text-align:left;font-size:15px;width:100%}

/* ================= sheets, viewer ================= */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet .scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
.sheet .panel{position:relative;width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:var(--sheet);color:var(--ink);border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .26s cubic-bezier(.2,.9,.3,1)}
.panel .grab{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 10px}
.panel h3{margin:0;font-size:19px}
.panel .sub{margin:2px 0 12px;color:var(--ink2);font-size:13.5px}
.panel .x{position:absolute;right:8px;top:8px;border:0;background:none;padding:8px 10px;color:var(--ink2);font-size:14px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cc{border:0;background:var(--chip);border-radius:14px;padding:8px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;position:relative}
.cc svg{width:84px;height:62px}
.cc .n{font-weight:700;font-size:14px;line-height:1.1}
.cc .dd{font-size:11px;color:var(--ink2);line-height:1.3;min-height:28px}
.cc[aria-current=true]{box-shadow:0 0 0 2px var(--accent)}
.cc .vtag{position:absolute;top:6px;right:6px;font-size:9.5px;font-weight:700;background:var(--accent);color:#fff;border-radius:6px;padding:1px 5px}
.fgrp{margin:14px 0 6px;font-size:12.5px;font-weight:700;color:var(--ink2);letter-spacing:.03em}
.flm{display:grid;grid-template-columns:68px 1fr;gap:12px;align-items:center;padding:9px 0;border:0;border-bottom:1px solid var(--rule);width:100%;text-align:left;background:none}
.flm .bx{width:68px;height:48px;border-radius:4px;position:relative;overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.bx .iso{position:absolute;left:6px;top:4px;font-size:17px;font-weight:700;line-height:1}
.bx .bn{position:absolute;left:0;right:0;bottom:0;height:40%;display:flex;align-items:center;padding:0 6px;font-size:10px;font-weight:700;white-space:nowrap}
.flm .nm{font-weight:600}
.flm .nt{font-size:12.5px;color:var(--ink2);line-height:1.35}
.flm[aria-current=true] .nm::after{content:"✓";margin-left:8px;color:var(--accent)}
.slider{display:flex;align-items:center;gap:12px;padding:8px 0}
.slider label{width:110px;font-size:14px}
.slider input{flex:1;accent-color:var(--accent)}
.slider output{width:40px;text-align:right;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.btn{border:0;border-radius:999px;padding:10px 20px;background:var(--ink);color:var(--bg);font-weight:600}
.btn.quiet{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule)}
.btn.red{background:var(--danger);color:#fff}
.tip{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.tip i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-style:normal;font-weight:700;display:grid;place-items:center;font-size:14px}
.tip p{margin:0;line-height:1.45}
#viewer{position:fixed;inset:0;z-index:40;background:#060606;color:#eee;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vbar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;flex:none}
.vbar button{border:0;background:none;color:#eee;padding:8px;display:grid;place-items:center}
.vstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 6px;touch-action:pan-y}
.vstage img,.vstage video{max-width:100%;max-height:100%;display:block;-webkit-user-drag:none}
.vfoot{display:flex;justify-content:space-around;padding:6px 10px 12px;flex:none}
.vfoot button{border:0;background:none;color:#eee;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;padding:6px 14px}
.vfoot .dg{color:#ff6b5b}
.vinfo{text-align:center;color:#999;font-size:12px;padding:0 12px 4px}
#toast{position:fixed;left:50%;bottom:calc(240px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);max-width:min(88vw,420px);padding:9px 16px;border-radius:12px;background:rgba(20,22,21,.92);color:#fff;font-size:14px;line-height:1.45;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.low{bottom:calc(40px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.tool span{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .tile{width:100%;border-radius:10px;display:grid;place-items:center;padding:4px 0}
.sitem .ic{background:var(--tile,var(--ib))}
</style>

<body>
<div id="app">

  <section id="scr-cam" class="screen on" aria-label="Camera">

          <div class="evpanel" id="evpanel"><button id="evm" aria-label="-">−</button><input type="range" id="evrange" min="-6" max="6" step="1" value="0" data-tl="ev"><button id="evp" aria-label="+">+</button></div>
          <div class="recpill" id="recpill">0:00</div>
          <div class="zoombar" id="zoombar"></div>
          <div class="cd" id="cd"></div>
          <div class="vfmsg" id="vfmsg" hidden></div>
        </div>
      </div>
    </div>

    <div class="base" id="base">
      <div class="moderow">
        <button class="allbtn" id="allcams"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span data-t="all_cams"></span></button>
        <div class="seg" id="modeseg"><button id="m-photo" data-m="photo" data-t="photo"></button><button id="m-video" data-m="video" data-t="video"></button></div>
        <div class="camtag" id="camtag"></div>
      </div>
      <div class="strip" id="strip" role="listbox"></div>
      <div class="ctrl">
        <button class="galbtn" id="galbtn" data-tl="gallery"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M4 17l5-4.5 3.5 3 3-2.5 4.5 4"/></svg></button>

      </div>

  <section id="scr-gal" class="screen" aria-label="Gallery">

      <div class="phead">
        <button class="iconbtn" id="galback" data-tl="close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>

  </section>
</div>

<div class="sheet" id="sheet" hidden><div class="scrim" id="scrim"></div><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

/* ---------- storage (IndexedDB) ---------- */
var DB = (function(){
  var dbp = null;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise(function(res, rej){
      var r = indexedDB.open('muan2', 1);
      r.onupgradeneeded = function(){ var db = r.result; db.createObjectStore('media', { keyPath: 'id' }); db.createObjectStore('blobs', { keyPath: 'id' }); };
      r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); };
    });
    return dbp;
  }
  function req(r){ return new Promise(function(res, rej){ r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }
  function done(tx){ return new Promise(function(res, rej){ tx.oncomplete = function(){ res(); }; tx.onerror = function(){ rej(tx.error); }; tx.onabort = function(){ rej(tx.error); }; }); }
  return {
    add: function(meta, blob){ return open().then(function(db){ var tx = db.transaction(['media', 'blobs'], 'readwrite'); tx.objectStore('media').put(meta); tx.objectStore('blobs').put({ id: meta.id, blob: blob }); return done(tx); }); },
    put: function(meta){ return open().then(function(db){ var tx = db.transaction('media', 'readwrite'); tx.objectStore('media').put(meta); return done(tx); }); },
    list: function(){ return open().then(function(db){ return req(db.transaction('media').objectStore('media').getAll()); }).then(function(a){ return a.sort(function(x, y){ return y.t - x.t; }); }); },
    blob: function(id){ return open().then(function(db){ return req(db.transaction('blobs').objectStore('blobs').get(id)); }); },
    del: function(ids){ return open().then(function(db){ var tx = db.transaction(['media', 'blobs'], 'readwrite'); ids.forEach(function(i){ tx.objectStore('media').delete(i); tx.objectStore('blobs').delete(i); }); return done(tx); }); },
    clear: function(){ return open().then(function(db){ var tx = db.transaction(['media', 'blobs'], 'readwrite'); tx.objectStore('media').clear(); tx.objectStore('blobs').clear(); return done(tx); }); }
  };
})();

/* ---------- sound and haptics ---------- */
var actx = null;
function ensureAudio(){
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function burst(t0, dur, freq, q, gain){
  var len = Math.max(1, Math.ceil(actx.sampleRate * dur)), buf = actx.createBuffer(1, len, actx.sampleRate), dta = buf.getChannelData(0);
  for (var i = 0; i < len; i++) dta[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  var src = actx.createBufferSource(); src.buffer = buf;
  var f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  var g = actx.createGain(); g.gain.value = gain; src.connect(f); f.connect(g); g.connect(actx.destination); src.start(t0);
}
function tone(t0, dur, f0, f1, type, gain){
  var o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t0); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + .02);
}

    case 'leaf': burst(x, .03, 1800, .8, .6); burst(x + .03, .035, 1100, .8, .5); break;
    case 'inst': burst(x, .03, 2400, 1, .7); tone(x + .08, .7, 140, 230, 'sawtooth', .022); break;
    case 'toy': burst(x, .02, 2200, 1.4, .9); burst(x + .035, .02, 3200, 1.6, .6); break;
    case 'digi': tone(x, .07, 2400, 2400, 'square', .04); burst(x + .02, .03, 3000, 1, .5); break;

  rec.iv = setInterval(function(){ var s = (performance.now() - rec.t0) / 1000; $('#recpill').textContent = fmtTime(s); if (s >= 180) { toast(t('rec_max'), 3000); stopRecord(); } }, 250);
}
function stopRecord(){
  if (!rec.on) return; rec.on = false; clearInterval(rec.iv); setRecUI(false); sndShutter('rec'); buzz(20);
  try { rec.mr.stop(); } catch (e) { rec.mr.onstop = null; onRecStop(); }
}
async function onRecStop(){
  var dur = (performance.now() - rec.t0) / 1000;
  if (rec.mic) rec.mic.getTracks().forEach(function(tr){ tr.stop(); }); rec.mic = null;
  var blob = new Blob(rec.chunks, { type: (rec.mr && rec.mr.mimeType) || rec.mime || 'video/webm' }); rec.chunks = [];
  if (blob.size < 1000) { toast(t('shot_fail')); return; }
  try { var thumb = await makeThumb(view); await commitMedia('video', null, { blob: blob, thumb: thumb, w: view.width, h: view.height, dur: dur }); toast(t('rec_done'), 2200); }
  catch (e) { console.error(e); toast(t('save_fail')); }
  layout();
}

/* ---------- saving to the device, sharing ---------- */
var dl = null, dlReady = (async function(){ try { dl = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('downloads') : null; } catch (e) { dl = null; } })();
async function saveFile(name, blob){
  if (isApp) { var uri = await saveToAlbum(name, blob); toast(uri ? t('saved_album') : t('save_fail')); return uri; }
  await dlReady;
  if (dl) { try { await dl.save({ filename: name, data: blob }); toast(t('saved')); return true; } catch (e) { if (e && e.code === 'declined') return false; } }
  try { var a = document.createElement('a'), u = URL.createObjectURL(blob); a.href = u; a.download = name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 5000); toast(t('saved')); return true; }
  catch (e) { toast(t('save_fail')); return false; }
}
async function shareItem(it){
  var r = await DB.blob(it.id); if (!r) return; var blob = r.blob;
  if (isApp) {
    var uri = it.uri; if (!uri) { uri = await saveToAlbum(it.name, blob); if (uri) { it.uri = uri; DB.put(it); } }
    if (uri && B.shareUri) { try { B.shareUri(uri, (blob.type || '').split(';')[0]); } catch (e) { toast(t('save_fail')); } } else toast(t('save_fail'));
    return;
  }
  try { var f = new File([blob], it.name, { type: blob.type }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  await saveFile(it.name, blob);
}

/* ---------- gallery ---------- */
var gal = { items: [], urls: [], sel: false, picked: {} };
function revokeGal(){ gal.urls.forEach(function(u){ URL.revokeObjectURL(u); }); gal.urls = []; }
async function renderGallery(){
  gal.items = await DB.list().catch(function(){ return []; }); revokeGal();
  var h = '';
  gal.items.forEach(function(it, i){
    var u = URL.createObjectURL(it.thumb); gal.urls.push(u);
    h += '<button class="gitem' + (gal.picked[it.id] ? ' picked' : '') + '" data-i="' + i + '" style="background-image:url(\'' + u + '\')" aria-label="' + (it.type === 'video' ? t('video') : t('photo')) + ' ' + (i + 1) + '">' +
      (it.type === 'video' ? '<span class="vb"><svg class="i" style="width:14px;height:14px;fill:#fff" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>' + fmtTime(it.dur || 0) + '</span>' : '') + '<i class="ck"></i></button>';
  });
  $('#ggrid').innerHTML = h; $('#galempty').hidden = gal.items.length > 0; $('#galsel').hidden = !gal.items.length;
  $('#galpage').classList.toggle('sel', gal.sel); updateSelBar();
  updateGalThumb(gal.items[0] ? gal.items[0].thumb : null);
}
function pickedIds(){ return Object.keys(gal.picked).filter(function(k){ return gal.picked[k]; }); }
function updateSelBar(){
  var n = pickedIds().length; $('#selbar').hidden = !gal.sel; $('#galtitle').textContent = gal.sel ? t('gal_n', n) : t('gal_title');
  $('#galsel').textContent = gal.sel ? t('gal_done') : t('gal_select'); $('#sb-save').disabled = !n; $('#sb-del').disabled = !n;
  $('#ggrid').style.paddingBottom = gal.sel ? '80px' : '2px';
}
$('#galsel').addEventListener('click', function(){ gal.sel = !gal.sel; gal.picked = {}; $('#galpage').classList.toggle('sel', gal.sel); $$('.gitem').forEach(function(g){ g.classList.remove('picked'); }); updateSelBar(); });
$('#ggrid').addEventListener('click', function(e){
  var b = e.target.closest('.gitem'); if (!b) return; var it = gal.items[+b.dataset.i];
  if (gal.sel) { gal.picked[it.id] = !gal.picked[it.id]; b.classList.toggle('picked', !!gal.picked[it.id]); updateSelBar(); } else openViewer(+b.dataset.i);
});
$('#sb-save').addEventListener('click', async function(){
  var ids = pickedIds(); for (var i = 0; i < ids.length; i++) { var it = gal.items.find(function(x){ return x.id === ids[i]; }), r = await DB.blob(ids[i]); if (it && r) await saveFile(it.name, r.blob); }
});
function confirmDelete(ids, after){
  openSheet('<h3>' + t('del_q', ids.length) + '</h3><p class="sub">' + t('del_d') + '</p><div class="sheet-actions"><button class="btn quiet" id="no">' + t('cancel') + '</button><button class="btn red" id="yes">' + t('gal_del') + '</button></div>', function(p){
    $('#no', p).addEventListener('click', closeSheet);
    $('#yes', p).addEventListener('click', async function(){ await DB.del(ids); closeSheet(); gal.picked = {}; if (after) after(); await renderGallery(); });
  });
}
$('#sb-del').addEventListener('click', function(){ var ids = pickedIds(); if (ids.length) confirmDelete(ids, function(){ gal.sel = false; }); });
$('#galback').addEventListener('click', function(){ go('cam'); });
$('#galbtn').addEventListener('click', function(){ go('gal'); });

/* viewer */
var vw = { idx: 0, url: null };
async function openViewer(i){ vw.idx = i; $('#viewer').hidden = false; await showViewer(); }
async function showViewer(){
  var it = gal.items[vw.idx]; if (!it) { closeViewer(); return; }
  var r = await DB.blob(it.id); if (!r) return; if (vw.url) URL.revokeObjectURL(vw.url); vw.url = URL.createObjectURL(r.blob);
  $('#vstage').innerHTML = it.type === 'video' ? '<video src="' + vw.url + '" controls playsinline autoplay></video>' : '<img alt="" src="' + vw.url + '">';
  $('#vcount').textContent = (vw.idx + 1) + ' / ' + gal.items.length;
  var c = CAM[it.cam] || CAMS[0], f = FILM[it.film] || curFilm(), d = new Date(it.t);
  $('#vinfo').textContent = t('info').replace('{0}', nm(c)).replace('{1}', nm(f)) + ' · ' + d.toLocaleDateString(S.lang === 'th' ? 'th-TH' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' + d.toLocaleTimeString(S.lang === 'th' ? 'th-TH' : 'en-GB', { hour: '2-digit', minute: '2-digit' });
}
function closeViewer(){ $('#viewer').hidden = true; $('#vstage').innerHTML = ''; if (vw.url) { URL.revokeObjectURL(vw.url); vw.url = null; } }
$('#vclose').addEventListener('click', closeViewer);
$('#v-save').addEventListener('click', async function(){ var it = gal.items[vw.idx], r = await DB.blob(it.id); if (r) saveFile(it.name, r.blob); });
$('#v-share').addEventListener('click', function(){ shareItem(gal.items[vw.idx]); });
$('#v-del').addEventListener('click', function(){ var it = gal.items[vw.idx]; confirmDelete([it.id], function(){ closeViewer(); }); });
(function(){
  var st = $('#vstage'), x0 = null;
  st.addEventListener('pointerdown', function(e){ x0 = e.target.tagName === 'VIDEO' ? null : e.clientX; });
  st.addEventListener('pointerup', function(e){
    if (x0 == null) return; var dx = e.clientX - x0; x0 = null; var n = gal.items.length;
    if (Math.abs(dx) > 50 && n > 1) { vw.idx = (vw.idx + (dx < 0 ? 1 : -1) + n) % n; showViewer(); }
  });
  document.addEventListener('keydown', function(e){
    if ($('#viewer').hidden) { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); return; }
    var n = gal.items.length; if (e.key === 'ArrowRight' && n) { vw.idx = (vw.idx + 1) % n; showViewer(); } if (e.key === 'ArrowLeft' && n) { vw.idx = (vw.idx - 1 + n) % n; showViewer(); } if (e.key === 'Escape') closeViewer();
  });
})();

/* ---------- sheets: cameras, films, tips ---------- */
function tileBg(c){ return lum(c.body) > .35 ? '#2b2e31' : '#e4e7ea'; }
function openCamSheet(){
  var h = '<button class="x" id="shx">' + t('close') + '</button><h3>' + t('pick_cam') + '</h3><p class="sub">' + t('pick_cam_d') + '</p><div class="cgrid">';
  CAMS.forEach(function(c){
    h += '<button class="cc" data-id="' + c.id + '" aria-current="' + (c.id === S.camera) + '">' + (c.vid ? '<span class="vtag">' + t('video_first') + '</span>' : '') +
      '<div class="tile" style="background:' + tileBg(c) + '">' + camIcon(c) + '</div><div class="n">' + nm(c) + '</div><div class="dd">' + ds(c) + '</div></button>';
  });
  openSheet(h + '</div>', function(p){
    $('#shx', p).addEventListener('click', closeSheet);
    $$('.cc', p).forEach(function(b){ b.addEventListener('click', function(){ selectCamera(b.dataset.id); closeSheet(); }); });
    var cur = $('.cc[aria-current="true"]', p); if (cur) p.scrollTop = Math.max(0, cur.offsetTop - 120);
  });
}
function filmRow(f, cur){
  return '<button class="flm" data-f="' + f.id + '" aria-current="' + (cur === f.id) + '"><div class="bx" style="background:' + f.box[0] + '"><span class="iso" style="color:' + f.box[2] + '">' + f.iso + '</span><span class="bn" style="background:' + f.box[1] + ';color:' + f.box[3] + '">' + nm(f) + '</span></div><div><div class="nm">' + nm(f) + ' ' + f.iso + '</div><div class="nt">' + ds(f) + '</div></div></button>';
}
function openFilmSheet(){
  var cf = S.film, h = '<button class="x" id="shx">' + t('close') + '</button><h3>' + t('film_title') + '</h3><p class="sub">' + t('film_d') + '</p>' +
    '<div class="slider"><label for="lk">' + t('adj_look') + '</label><input type="range" id="lk" min="0" max="100" value="' + S.look + '"><output id="lko">' + S.look + '</output></div>' +
    '<div class="slider"><label for="gr">' + t('adj_grain') + '</label><input type="range" id="gr" min="0" max="150" value="' + S.grain + '"><output id="gro">' + S.grain + '</output></div>' +
    '<button class="flm" data-f="auto" aria-current="' + (cf === 'auto') + '"><div class="bx" style="background:' + curCam().body + '"><span class="iso" style="color:' + curCam().trim + '">★</span><span class="bn" style="background:' + curCam().trim + ';color:#111">' + nm(curCam()) + '</span></div><div><div class="nm">' + t('film_auto') + '</div><div class="nt">' + t('film_auto_d') + ' · ' + nm(FILM[curCam().film]) + '</div></div></button>';
  FILM_GROUPS.forEach(function(g){ h += '<div class="fgrp">' + t('g_' + g) + '</div>'; FILMS.filter(function(f){ return f.grp === g; }).forEach(function(f){ h += filmRow(f, cf); }); });
  openSheet(h, function(p){
    $('#shx', p).addEventListener('click', closeSheet);
    $('#lk', p).addEventListener('input', function(){ S.look = +this.value; $('#lko', p).textContent = this.value; save(); });
    $('#gr', p).addEventListener('input', function(){ S.grain = +this.value; $('#gro', p).textContent = this.value; save(); });
    $$('.flm', p).forEach(function(b){ b.addEventListener('click', function(){ S.film = b.dataset.f; save(); state.look = lookFor(); updateTools(); applySkin(); closeSheet(); buzz(8); toast(nm(curFilm()) + ' ' + curFilm().iso, 1500); }); });
    var cur = $('.flm[aria-current="true"]', p); if (cur && cf !== 'auto') p.scrollTop = Math.max(0, cur.offsetTop - 200);
  });
}
function openTips(){
  openSheet('<h3>' + t('tips_title') + '</h3><div class="tip"><i>1</i><p>' + t('tip1') + '</p></div><div class="tip"><i>2</i><p>' + t('tip2') + '</p></div><div class="tip"><i>3</i><p>' + t('tip3') + '</p></div><div class="sheet-actions"><button class="btn" id="tok">' + t('tip_ok') + '</button></div>', function(p){
    $('#tok', p).addEventListener('click', function(){ S.seen = true; save(); closeSheet(); });
  });
}

/* ---------- settings ---------- */
var SEGS = { langseg: 'lang', gridseg: 'grid', dateseg: 'dateMode', fmtseg: 'dateFmt', qseg: 'quality', vqseg: 'vq' };
function updateSettingsUI(){
  Object.keys(SEGS).forEach(function(id){ $$('#' + id + ' button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.v === S[SEGS[id]])); }); });
  $$('.tog').forEach(function(tg){ tg.checked = !!S[tg.dataset.k]; });
  $('#volrow').hidden = !isApp; $('#autorow').hidden = !isApp;
}
function bindSettings(){
  Object.keys(SEGS).forEach(function(id){
    $('#' + id).addEventListener('click', function(e){
      var b = e.target.closest('button'); if (!b) return; var k = SEGS[id]; S[k] = b.dataset.v; save();
      if (k === 'lang') applyLang(); else { updateSettingsUI(); if (k === 'grid') updateTools(); if (k === 'vq') layout(); }
    });
  });
  $$('.tog').forEach(function(tg){ tg.addEventListener('change', function(){ S[tg.dataset.k] = tg.checked; save(); if (tg.dataset.k === 'frames') layout(); if (tg.dataset.k === 'haptics' && tg.checked) buzz(15); if (tg.dataset.k === 'volkeys') syncVol(); }); });
  $('#setback').addEventListener('click', function(){ go('cam'); });
  $('#showtips').addEventListener('click', openTips);
  $('#clearall').addEventListener('click', function(){
    openSheet('<h3>' + t('clear_q') + '</h3><p class="sub">' + t('clear_d') + '</p><div class="sheet-actions"><button class="btn quiet" id="no">' + t('cancel') + '</button><button class="btn red" id="yes">' + t('gal_del') + '</button></div>', function(p){
      $('#no', p).addEventListener('click', closeSheet);
      $('#yes', p).addEventListener('click', async function(){ await DB.clear(); updateGalThumb(null); closeSheet(); toast(t('saved')); });
    });
  });
}
function applyLang(){
  document.documentElement.lang = S.lang; document.title = t('title');
  $$('[data-t]').forEach(function(e){ e.textContent = t(e.dataset.t); });
  $$('[data-tl]').forEach(function(e){ var v = t(e.dataset.tl); e.setAttribute('aria-label', v); e.title = v; });
  applySkin(); buildStrip(); updateStrip(false); updateTools(); buildZoomBar(); updateEV(); updateSettingsUI(); updateSelBar();
}

/* ---------- navigation ---------- */
function syncVol(){ if (isApp && B.setVolKeys) { try { B.setVolKeys(!!(S.volkeys && state.screen === 'cam')); } catch (e) {} } }
function go(name){
  state.screen = name;
  $$('.screen').forEach(function(s){ s.classList.toggle('on', s.id === 'scr-' + name); });
  if (name === 'cam') {
    if (cam.demo) startLoop(); else if (!cam.ok && !cam.starting) startCamera(false); else if (cam.ok) startLoop();
    requestAnimationFrame(function(){ layout(); updateStrip(false); });
  } else { if (cam.ok) stopCamera(); else if (cam.demo) stopLoop(); }
  if (name === 'gal') { gal.sel = false; gal.picked = {}; renderGallery(); }
  var sc = $('#scr-' + name); if (sc && name !== 'cam') sc.scrollTop = 0;
  syncBars(); syncVol();
}
window.__muanBack = function(){
  if (!$('#viewer').hidden) { closeViewer(); return true; }
  if (!$('#sheet').hidden) { closeSheet(); return true; }
  if (state.timer) { cancelTimer(); return true; }
  if (state.screen !== 'cam') { go('cam'); return true; }
  return false;
};
window.__muanShutter = function(){
  if (!S.volkeys || state.screen !== 'cam' || !$('#sheet').hidden || !$('#viewer').hidden) return;
  onShutter();
};
document.addEventListener('visibilitychange', function(){
  if (document.hidden) { if (rec.on) stopRecord(); if (state.timer) cancelTimer(); if (cam.ok) { stopCamera(); cam.resume = true; } }
  else if (cam.resume && state.screen === 'cam') { cam.resume = false; startCamera(false); }
});
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncBars); } catch (e) {}

/* ---------- boot ---------- */
(async function boot(){
  bindSettings(); applyLang(); layout(); updateStrip(false);
  try { var list = await DB.list(); if (list[0]) updateGalThumb(list[0].thumb); } catch (e) {}
  if (!S.seen) setTimeout(function(){ if ($('#sheet').hidden) openTips(); }, 1100);
  startCamera(false); syncVol();
  window.__muan = { S: S, state: state, cam: cam, rec: rec, DB: DB, go: go, CAMS: CAMS, FILMS: FILMS, selectCamera: selectCamera, applyLang: applyLang, startDemo: startDemo, lookFor: lookFor,
    renderLook: function(src, camId, filmId){ var old = [S.camera, S.film]; S.camera = camId; S.film = filmId || 'auto'; var p = lookFor(), c = curCam(), cr = cropFor(src.width, src.height, c.ar, false);
      var k = Math.min(1, 900 / Math.max(src.width * cr.cw, src.height * cr.ch)), w = Math.round(src.width * cr.cw * k), h = Math.round(src.height * cr.ch * k);
      RC.draw(src, src.width, src.height, cr, p, w, h, { seed: .37, time: 3, taps: 8, mix: 1, grain: 1, flash: 0 }); var o = document.createElement('canvas'); o.width = w; o.height = h; o.getContext('2d').drawImage(RC.canvas, 0, 0);
      S.camera = old[0]; S.film = old[1]; return o; } };
})();
})();

</script>
</body>
